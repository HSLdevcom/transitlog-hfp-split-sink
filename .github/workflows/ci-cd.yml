name: CI/CD

permissions:
  contents: read
  packages: read

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  merge_group:

jobs:
  ci-cd:
    uses: HSLdevcom/transitdata-shared-workflows/.github/workflows/ci-cd-java.yml@main
    secrets: inherit
    with:
      runTestsInsideDocker: true

  diagnose-maven:
    name: Diagnose Maven version validation
    needs: ci-cd
    if: ${{ always() && needs.ci-cd.result == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Evaluate Java version with Maven diagnostics
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          JAVA_TOOL_OPTIONS: ""
          MAVEN_OPTS: ""
        run: mvn -e -DforceStdout -Dstyle.color=never help:evaluate -Dexpression=maven.compiler.release

  publish-edge:
    name: Publish edge Docker tag
    needs: ci-cd
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: docker-hub-release
    permissions:
      contents: read
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_INFODEVOPS_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_INFODEVOPS_TOKEN }}
      - name: Tag the main image as edge
        run: docker buildx imagetools create --tag hsldevcom/transitlog-hfp-split-sink:edge hsldevcom/transitlog-hfp-split-sink:main
